* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 64px; }

.pixel { font-family: 'Press Start 2P', monospace; }

header.hero {
  position: sticky;
  top: 12px;
  z-index: 10;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 20px 20px;
  box-shadow: 0 4px 18px rgba(67, 57, 95, 0.08);
  margin-bottom: 22px;
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero-top h1 { font-size: 12px; margin: 0; letter-spacing: 1px; }
#pct { font-size: 15px; color: var(--focus); font-variant-numeric: tabular-nums; }

.bar-zone { position: relative; margin-top: 46px; }
#pet {
  position: absolute;
  bottom: 15px;
  left: 0;
  width: 39px;
  image-rendering: pixelated;
  transform: translateX(-50%);
  transition: left 0.5s ease;
}
.bar { height: 18px; border-radius: 9px; background: var(--track); overflow: hidden; }
.bar-fill {
  height: 100%;
  width: 0%;
  border-radius: 9px;
  background: linear-gradient(90deg, var(--fill-a), var(--fill-b), var(--fill-c));
  transition: width 0.5s ease;
}
.hero-sub { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#pet-word { color: var(--focus); }

details.chapter {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 14px;
  overflow: hidden;
}
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.ch-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.ch-chip {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 12px;
  background: var(--ch-soft);
  color: var(--ch-deep);
}
.ch-name { flex: 1 1 auto; min-width: 0; }
.ch-name .t { font-weight: 600; }
.ch-name .c { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch-mini { flex: none; width: 72px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.ch-mini > div { height: 100%; background: var(--ch-deep); border-radius: 4px; transition: width 0.3s ease; }
.chev { flex: none; color: var(--muted); transition: transform 0.2s ease; font-size: 11px; }
details[open] > summary .chev { transform: rotate(90deg); }

.tasks { border-top: 1px solid var(--line); background: var(--card); padding: 4px 12px 8px; }
.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line);
  flex-wrap: wrap;
}
.task:last-child { border-bottom: none; }
.task input[type="checkbox"] {
  appearance: none;
  flex: none;
  width: 18px;
  height: 18px;
  border: 2px solid var(--ch-deep, var(--focus));
  border-radius: 4px;
  background: var(--card);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.task input[type="checkbox"]:checked { background: var(--ch-deep, var(--focus)); }
.task input[type="checkbox"]:checked::after {
  content: "";
  width: 10px;
  height: 10px;
  background: var(--card);
  clip-path: polygon(14% 44%, 0 65%, 40% 100%, 100% 16%, 80% 0%, 38% 62%);
}
.task input[type="checkbox"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.t-name { flex: 1 1 200px; min-width: 0; font-size: 14px; }
.t-name a { color: inherit; text-decoration-color: var(--muted); }
.t-name a:hover { color: var(--focus); }
.task.done .t-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.t-star { flex: none; font-size: 13px; color: var(--star); cursor: default; }
.t-time { flex: none; font-size: 11.5px; color: var(--muted); background: var(--bg-soft); border-radius: 5px; padding: 1px 6px; }
.note-box { flex: 0 1 210px; display: flex; align-items: center; gap: 6px; min-width: 140px; margin-left: auto; }
.note-box input {
  flex: 1;
  min-width: 0;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  color: var(--ink);
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 8px;
}
.note-box input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.note-box input::placeholder { color: var(--muted); opacity: 0.8; }
.note-open {
  flex: none;
  font-size: 12px;
  color: var(--focus);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 8px;
}
.note-open:hover { background: var(--bg-soft); }

.legend { display: flex; gap: 16px; align-items: center; font-size: 12.5px; color: var(--muted); margin: 0 4px 16px; flex-wrap: wrap; }
.legend .t-star { margin-right: 3px; }

footer {
  margin-top: 26px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
}
footer button, footer label.imp {
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
footer button:hover, footer label.imp:hover { background: var(--bg-soft); }
footer button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
#imp-file { display: none; }
.spacer { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  .bar-fill, #pet, .ch-mini > div, .chev { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <h1 class="pixel">READING TRACKER</h1>
      <div class="pixel" id="pct">0%</div>
    </div>
    <div class="bar-zone">
      <canvas id="pet" width="13" height="11" aria-hidden="true"></canvas>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
    <div class="hero-sub">
      <span id="count-line"></span>
      <span id="pet-word"></span>
    </div>
  </header>

  <div class="legend">
    <span><span class="t-star pixel">*</span>priority if you only have ~1 hour</span>
  </div>
  <main id="reading-weeks"></main>

  <footer>
    <button id="exp-btn" type="button">Export progress.json</button>
    <label class="imp" for="imp-file">Import</label>
    <input type="file" id="imp-file" accept="application/json">
    <span class="spacer"></span>
    <span>saved in this browser</span>
  </footer>
</div>

<script>
"use strict";

// Compulsory ("Recommended") readings from the Redwood Research
// AI futurism reading list (blog.redwoodresearch.org/p/ai-futurism-reading-list).
// star = highest priority if time-limited.
const READINGS = [{"name": "Week 1: Timelines / takeoff modeling", "items": [{"t": "Three Types of Intelligence Explosion", "url": "https://www.forethought.org/research/three-types-of-intelligence-explosion", "star": 1, "time": "30 min"}, {"t": "A breakdown of AI capability levels focused on AI R&D labor acceleration", "url": "https://www.alignmentforum.org/posts/LjgcRbptarrRfJWtR/a-breakdown-of-ai-capability-levels-focused-on-ai-r-and-d", "star": 0, "time": ""}, {"t": "Six milestones for AI automation (similar)", "url": "https://www.planned-obsolescence.org/p/six-milestones-for-ai-automation", "star": 0, "time": ""}, {"t": "Will AI R&D Automation Cause a Software Intelligence Explosion?", "url": "https://www.forethought.org/research/will-ai-r-and-d-automation-cause-a-software-intelligence-explosion", "star": 0, "time": "1.5 hr"}, {"t": "Full automation of AI R&D probably yields a large speed up even without a software-only singularity", "url": "https://blog.redwoodresearch.org/p/full-automation-of-ai-r-and-d-probably", "star": 0, "time": ""}, {"t": "AI Futures Model: Dec 2025 update", "url": "https://blog.ai-futures.org/p/ai-futures-model-dec-2025-update", "star": 1, "time": ""}, {"t": "ECI Documentation - Overview (Epoch AI)", "url": "https://epoch.ai/data/eci-documentation", "star": 0, "time": ""}, {"t": "Clarifying limitations of time horizon (METR)", "url": "https://metr.org/notes/2026-01-22-time-horizon-limitations/", "star": 0, "time": ""}, {"t": "Ryan Greenblatt on the Dwarkesh Podcast (Zvi's summary)", "url": "https://thezvi.substack.com/p/on-dwarkesh-patels-podcast-with-ryan", "star": 0, "time": ""}]}, {"name": "Week 2: Misaligned AI takeover threat modeling", "items": [{"t": "The behavioral selection model for predicting AI motivations", "url": "https://www.lesswrong.com/posts/FeaJcWkC6fuRAMsfp/the-behavioral-selection-model-for-predicting-ai-motivations-1", "star": 1, "time": "25 min"}, {"t": "Risk from fitness-seeking AIs: mechanisms and mitigations", "url": "https://blog.redwoodresearch.org/p/risk-from-fitness-seeking-ais-mechanisms", "star": 0, "time": "40 min"}, {"t": "Will AIs fake alignment during training in order to get power (summary)", "url": "https://www.lesswrong.com/posts/yFofRxg7RRQYCcwFA/new-report-scheming-ais-will-ais-fake-alignment-during", "star": 1, "time": "40 min"}, {"t": "AI 2027 (skim) + AI Goals Forecast", "url": "https://ai-2027.com/", "star": 0, "time": "3 hr"}, {"t": "Ryan on the 80,000 Hours podcast (takeover threat modeling, 00:17-00:34)", "url": "https://redwoodresearch.substack.com/p/ryan-on-the-80000-hours-podcast", "star": 0, "time": ""}, {"t": "Another (outer) alignment failure story", "url": "https://www.lesswrong.com/posts/AyNHoTWWAJ5eb99ji/another-outer-alignment-failure-story", "star": 0, "time": "15 min"}, {"t": "What failure looks like", "url": "https://www.lesswrong.com/posts/HBxe6wdjxK239zajf/what-failure-looks-like", "star": 0, "time": "15 min"}, {"t": "Current AIs seem pretty misaligned to me", "url": "https://blog.redwoodresearch.org/p/current-ais-seem-pretty-misaligned", "star": 0, "time": "40 min"}, {"t": "The persona selection model (Anthropic)", "url": "https://www.anthropic.com/research/persona-selection-model", "star": 0, "time": ""}]}, {"name": "Week 3: Control", "items": [{"t": "The case for ensuring that powerful AIs are controlled", "url": "https://redwoodresearch.substack.com/p/the-case-for-ensuring-that-powerful", "star": 1, "time": ""}, {"t": "Buck on the 80,000 Hours podcast (alt to above)", "url": "https://redwoodresearch.substack.com/p/buck-on-the-80000-hours-podcast", "star": 0, "time": ""}, {"t": "The Case Against AI Control Research (counter)", "url": "https://www.lesswrong.com/posts/8wBN8cdNAv3c7vt6p/the-case-against-ai-control-research", "star": 0, "time": ""}, {"t": "AI Catastrophes and Rogue Deployments", "url": "https://redwoodresearch.substack.com/p/ai-catastrophes-and-rogue-deployments", "star": 1, "time": ""}, {"t": "An overview of areas of control work", "url": "https://blog.redwoodresearch.org/p/an-overview-of-areas-of-control-work", "star": 1, "time": ""}, {"t": "Prioritizing threats for AI control", "url": "https://blog.redwoodresearch.org/p/prioritizing-threats-for-ai-control?utm_source=publication-search", "star": 0, "time": ""}, {"t": "Win/continue/lose scenarios and execute/replace/audit protocols", "url": "https://redwoodresearch.substack.com/p/wincontinuelose-scenarios-and-executereplaceaudi", "star": 0, "time": ""}, {"t": "Thoughts on the conservative assumptions in AI control", "url": "https://redwoodresearch.substack.com/p/thoughts-on-the-conservative-assumptions", "star": 0, "time": ""}, {"t": "Misalignment and Strategic Underperformance: Sandbagging and Exploration Hacking", "url": "https://redwoodresearch.substack.com/p/misalignment-and-strategic-underperformance", "star": 0, "time": ""}, {"t": "Catching AIs Red-Handed", "url": "https://redwoodresearch.substack.com/p/catching-ais-red-handed", "star": 0, "time": ""}, {"t": "AIs at the current capability level may be important for future safety work", "url": "https://redwoodresearch.substack.com/p/ais-at-the-current-capability-level", "star": 0, "time": ""}, {"t": "Jankily Controlling Superintelligence", "url": "https://redwoodresearch.substack.com/p/jankily-controlling-superintelligence", "star": 0, "time": ""}]}, {"name": "Week 4: Governance / strategy", "items": [{"t": "Plans A, B, C, and D for misalignment risk", "url": "https://blog.redwoodresearch.org/p/plans-a-b-c-and-d-for-misalignment", "star": 1, "time": ""}, {"t": "How do we (more) safely defer to AIs? (can skim)", "url": "https://blog.redwoodresearch.org/p/how-do-we-more-safely-defer-to-ais", "star": 1, "time": ""}, {"t": "AI 2027: race/slowdown endings after branching point", "url": "https://ai-2027.com/", "star": 0, "time": ""}, {"t": "AIFP CEO takeover scenario", "url": "https://blog.ai-futures.org/p/how-an-ai-company-ceo-could-quietly", "star": 0, "time": "20 min"}, {"t": "Ten people on the inside", "url": "https://blog.redwoodresearch.org/p/ten-people-on-the-inside", "star": 0, "time": "5 min"}, {"t": "Situational Awareness (essays III-V)", "url": "https://situational-awareness.ai/", "star": 0, "time": "3 hr"}, {"t": "Crucial considerations in ASI deterrence", "url": "https://oscardelaney.substack.com/p/crucial-considerations-in-asi-deterrence", "star": 0, "time": "20 min"}, {"t": "Should the US do a Manhattan Project for AGI?", "url": "https://peterwildeford.substack.com/cp/179934553", "star": 0, "time": "20 min"}, {"t": "Trump Administration S&T Highlights: Year One (skim AI section)", "url": "https://www.whitehouse.gov/wp-content/uploads/2026/01/WHOSTP-2025-Wins.pdf", "star": 0, "time": ""}, {"t": "With the RAISE Act, New York Aligns With California on Frontier AI Laws", "url": "https://carnegieendowment.org/emissary/2026/02/ai-state-law-new-york-raise-act-california-sb53", "star": 0, "time": ""}, {"t": "How China Views AI Risks and What to do About Them", "url": "https://carnegieendowment.org/research/2025/10/how-china-views-ai-risks-and-what-to-do-about-them", "star": 0, "time": ""}, {"t": "Why China isn't about to leap ahead of the West on compute", "url": "https://epoch.ai/gradient-updates/why-china-isnt-about-to-leap-ahead-of-the-west-on-compute", "star": 0, "time": ""}, {"t": "Chinese AI models have lagged the US frontier by 7 months on average since 2023", "url": "https://epoch.ai/data-insights/us-vs-china-eci", "star": 0, "time": ""}, {"t": "No, the 2017 New Generation AI Development Plan did not include a goal of building AGI", "url": "https://substack.com/home/post/p-186039653", "star": 0, "time": ""}]}];

const READING_HUES = ["ch0", "ch1", "ch2", "ch3"];

const STORE_KEY = "reading-progress-v1";

const READING_TOTAL = READINGS.reduce((n, w) => n + w.items.length, 0);

function emptyState() {
  return { tasks: {}, open: {} };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (typeof parsed !== "object" || parsed === null || !parsed.tasks) {
        throw new Error("stored progress has unexpected shape");
      }
      const st = emptyState();
      st.tasks = parsed.tasks;
      st.open = parsed.open || {};
      return st;
    }
    return emptyState();
  } catch (err) {
    alert("Stored progress could not be read: " + err.message);
    return emptyState();
  }
}

let state = loadState();

function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function isUrl(s) {
  return /^https?:\/\//.test(s);
}

// --- pixel pet -------------------------------------------------------------
// Maps use single letters; the pet resolves letters to CSS custom properties.
const OWL_FRAMES = [[
  ".KK.......KK.",
  ".KAK.....KAK.",
  ".KAAKKKKKAAK.",
  "KAAAAAAAAAAK.",
  "KAWWKAAKWWAK.",
  "KAWEKAAKEWAK.",
  "KAAAKYYKAAAK.",
  "KABBBBBBBBAK.",
  "KABBBBBBBBAK.",
  ".KAABBBBAAK..",
  "..KKYY.YYKK..",
], [
  ".KK.......KK.",
  ".KAK.....KAK.",
  ".KAAKKKKKAAK.",
  "KAAAAAAAAAAK.",
  "KAAAKAAKAAAK.",
  "KAKKKAAKKKAK.",
  "KAAAKYYKAAAK.",
  "KABBBBBBBBAK.",
  "KABBBBBBBBAK.",
  ".KAABBBBAAK..",
  "..KKYY.YYKK..",
]];
const PARTY_HAT = [
  "....hH.......",
  "...KHHK......",
  "..KHHHHK.....",
];

const PET_MAP = { K: "--pet-outline", A: "--owl-a", B: "--owl-b", Y: "--owl-c",
                  W: "--eye-white", E: "--pet-outline", H: "--hat-a", h: "--hat-b" };

const petCanvas = document.getElementById("pet");
const petCtx = petCanvas.getContext("2d");
let petFrame = 0;

function drawPet() {
  const [done, total] = counts();
  const party = total > 0 && done === total;
  const base = OWL_FRAMES[petFrame];
  const rows = party ? PARTY_HAT.concat(base) : base;
  petCanvas.height = rows.length;
  petCanvas.style.height = rows.length * 3 + "px";
  const css = getComputedStyle(document.documentElement);
  petCtx.clearRect(0, 0, petCanvas.width, petCanvas.height);
  rows.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch === ".") return;
      petCtx.fillStyle = css.getPropertyValue(PET_MAP[ch]).trim();
      petCtx.fillRect(x, y, 1, 1);
    });
  });
}

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
if (!reducedMotion.matches) {
  setInterval(() => { petFrame = 1 - petFrame; drawPet(); }, 600);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawPet);
new MutationObserver(drawPet).observe(document.documentElement, {
  attributes: true, attributeFilter: ["data-theme"],
});

// --- counting --------------------------------------------------------------
function countDoneIn(keys) {
  return keys.filter((k) => state.tasks[k] && state.tasks[k].done).length;
}

function readingKeys(weekIdx) {
  const weeks = weekIdx === undefined ? READINGS.map((_, i) => i) : [weekIdx];
  return weeks.flatMap((w) => READINGS[w].items.map((_, i) => "w" + w + ":" + i));
}

function counts() {
  return [countDoneIn(readingKeys()), READING_TOTAL];
}

const PET_WORDS = [
  [0, "your pet is waiting for you to start"],
  [1, "your pet is cheering you on"],
  [50, "over halfway, your pet is proud"],
  [100, "all done, your pet is celebrating"],
];

function updateSummary() {
  const [done, total] = counts();
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("bar-fill").style.width = pct + "%";
  document.getElementById("pet").style.left = pct + "%";
  document.getElementById("count-line").textContent =
    done + " of " + total + " readings complete";
  document.getElementById("pet-word").textContent =
    PET_WORDS.filter(([min]) => pct >= min).pop()[1];

  READINGS.forEach((w, wi) => {
    const keys = readingKeys(wi);
    const wd = countDoneIn(keys);
    document.getElementById("mini-w" + wi).style.width =
      (wd / keys.length) * 100 + "%";
    document.getElementById("count-w" + wi).textContent = wd + "/" + keys.length;
  });

  drawPet();
}

// --- rows ------------------------------------------------------------------
function makeCheckbox(id, row, label) {
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = !!(state.tasks[id] && state.tasks[id].done);
  cb.setAttribute("aria-label", label + " complete");
  cb.addEventListener("change", () => {
    state.tasks[id] = state.tasks[id] || {};
    state.tasks[id].done = cb.checked;
    row.classList.toggle("done", cb.checked);
    saveState();
    updateSummary();
  });
  if (cb.checked) row.classList.add("done");
  return cb;
}

function makeNoteBox(id, label) {
  const box = document.createElement("span");
  box.className = "note-box";
  const entry = state.tasks[id] || {};
  const note = document.createElement("input");
  note.type = "text";
  note.placeholder = "notes link (optional)";
  note.value = entry.note || "";
  note.setAttribute("aria-label", "notes for " + label);
  const open = document.createElement("a");
  open.className = "note-open";
  open.textContent = "open";
  open.target = "_blank";
  open.rel = "noopener";
  function sync() {
    const v = note.value.trim();
    if (isUrl(v)) {
      open.href = v;
      open.style.display = "";
    } else {
      open.removeAttribute("href");
      open.style.display = "none";
    }
  }
  note.addEventListener("input", () => {
    state.tasks[id] = state.tasks[id] || {};
    state.tasks[id].note = note.value.trim();
    saveState();
    sync();
  });
  sync();
  box.append(note, open);
  return box;
}

function bindOpenState(det, key) {
  det.open = !!state.open[key];
  det.addEventListener("toggle", () => {
    state.open[key] = det.open;
    saveState();
  });
}

function buildReadingTask(wi, i, item) {
  const id = "w" + wi + ":" + i;
  const row = document.createElement("div");
  row.className = "task";
  const cb = makeCheckbox(id, row, item.t);
  const nameEl = document.createElement("span");
  nameEl.className = "t-name";
  const a = document.createElement("a");
  a.href = item.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = item.t;
  nameEl.appendChild(a);
  row.append(cb, nameEl);
  if (item.star) {
    const star = document.createElement("span");
    star.className = "t-star pixel";
    star.textContent = "*";
    star.title = "priority if you only have ~1 hour";
    row.appendChild(star);
  }
  if (item.time) {
    const time = document.createElement("span");
    time.className = "t-time";
    time.textContent = item.time;
    row.appendChild(time);
  }
  row.appendChild(makeNoteBox(id, item.t));
  return row;
}

function buildReading() {
  const root = document.getElementById("reading-weeks");
  READINGS.forEach((w, wi) => {
    const det = document.createElement("details");
    det.className = "chapter";
    const hue = READING_HUES[wi % READING_HUES.length];
    det.style.setProperty("--ch-soft", "var(--" + hue + "-soft)");
    det.style.setProperty("--ch-deep", "var(--" + hue + "-deep)");
    bindOpenState(det, "w" + wi);
    const sum = document.createElement("summary");
    sum.className = "ch-head";
    const parts = w.name.split(": ");
    sum.innerHTML =
      '<span class="ch-chip pixel">W' + (wi + 1) + "</span>" +
      '<span class="ch-name"><span class="t">' + (parts[1] || w.name) + "</span><br>" +
      '<span class="c" id="count-w' + wi + '"></span></span>' +
      '<span class="ch-mini"><div id="mini-w' + wi + '"></div></span>' +
      '<span class="chev pixel">&gt;</span>';
    det.appendChild(sum);
    const tasks = document.createElement("div");
    tasks.className = "tasks";
    w.items.forEach((item, i) => tasks.appendChild(buildReadingTask(wi, i, item)));
    det.appendChild(tasks);
    root.appendChild(det);
  });
}

// --- export / import -------------------------------------------------------
document.getElementById("exp-btn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "progress.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("imp-file").addEventListener("change", (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (typeof parsed !== "object" || parsed === null || !parsed.tasks) {
        throw new Error("file does not contain expected progress data");
      }
      localStorage.setItem(STORE_KEY, JSON.stringify(parsed));
      location.reload();
    } catch (err) {
      alert("Import failed: " + err.message);
    }
  };
  reader.readAsText(file);
});

buildReading();
updateSummary();
</script>
</body>
</html>
